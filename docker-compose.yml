services:
  postgres:
    image: postgres:16-alpine
    container_name: comforthotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: comforthotel
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: comforthotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comforthotel -d comforthotel"]
      interval: 10s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./services/product-service
    container_name: comforthotel-product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: product-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:comforthotel@postgres:5432/comforthotel
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: ./services/order-service
    container_name: comforthotel-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: order-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:comforthotel@postgres:5432/comforthotel
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-service:
    build:
      context: ./services/chat-service
    container_name: comforthotel-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: chat-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:comforthotel@postgres:5432/comforthotel
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: comforthotel-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://comforthotel:comforthotel@postgres:5432/comforthotel
      PRODUCT_SERVICE_URL: http://product-service:3000
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      MANAGER_USERNAME: ${MANAGER_USERNAME}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_FULL_NAME: ${MANAGER_FULL_NAME}
      USER_USERNAME: ${USER_USERNAME:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_FULL_NAME: ${USER_FULL_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    expose:
      - "3000"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: comforthotel-gateway
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: comforthotel-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: comforthotel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:
