services:
  postgres-app:
    image: postgres:16-alpine
    container_name: comforthotel-postgres-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: comforthotel_app
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comforthotel -d comforthotel_app"]
      interval: 30s
      timeout: 15s
      retries: 10

  postgres-product:
    image: postgres:16-alpine
    container_name: comforthotel-postgres-product
    restart: unless-stopped
    environment:
      POSTGRES_DB: comforthotel_product
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_product_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comforthotel -d comforthotel_product"]
      interval: 30s
      timeout: 15s
      retries: 10

  postgres-order:
    image: postgres:16-alpine
    container_name: comforthotel-postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: comforthotel_order
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comforthotel -d comforthotel_order"]
      interval: 30s
      timeout: 15s
      retries: 10

  postgres-chat:
    image: postgres:16-alpine
    container_name: comforthotel-postgres-chat
    restart: unless-stopped
    environment:
      POSTGRES_DB: comforthotel_chat
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comforthotel -d comforthotel_chat"]
      interval: 30s
      timeout: 15s
      retries: 10

  product-service:
    build:
      context: ./services/product-service
    container_name: comforthotel-product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: product-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres-product:5432/comforthotel_product
    depends_on:
      postgres-product:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  order-service:
    build:
      context: ./services/order-service
    container_name: comforthotel-order-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: order-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres-order:5432/comforthotel_order
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      postgres-order:
        condition: service_healthy
      product-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  payment-service:
    build:
      context: ./services/payment-service
    container_name: comforthotel-payment-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: payment-service
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  chat-service:
    build:
      context: ./services/chat-service
    container_name: comforthotel-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: chat-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres-chat:5432/comforthotel_chat
    depends_on:
      postgres-chat:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
    container_name: comforthotel-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: auth-service
      PORT: 3000
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres-app:5432/comforthotel_app
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      MANAGER_USERNAME: ${MANAGER_USERNAME}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_FULL_NAME: ${MANAGER_FULL_NAME}
    depends_on:
      postgres-app:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  app:
    build:
      context: ./services/main-app
      dockerfile: Dockerfile
    container_name: comforthotel-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres-app:5432/comforthotel_app
      PRODUCT_SERVICE_URL: http://product-service:3000
      CHAT_SERVICE_URL: http://chat-service:3000
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      MANAGER_USERNAME: ${MANAGER_USERNAME}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_FULL_NAME: ${MANAGER_FULL_NAME}
      USER_USERNAME: ${USER_USERNAME:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_FULL_NAME: ${USER_FULL_NAME:-}
    depends_on:
      postgres-app:
        condition: service_healthy
      product-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: comforthotel-gateway
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: comforthotel-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
      - cadvisor
      - docker-metrics-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: comforthotel-alertmanager
    restart: unless-stopped
    entrypoint:
      - "sh"
      - "/etc/alertmanager/start-alertmanager.sh"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL is required for Alertmanager}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#alerts}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:?SMTP_SMARTHOST is required for Alertmanager}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required for Alertmanager}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:?SMTP_AUTH_USERNAME is required for Alertmanager}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:?SMTP_AUTH_PASSWORD is required for Alertmanager}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?ALERT_EMAIL_TO is required for Alertmanager}
    volumes:
      - ./monitoring/alertmanager/start-alertmanager.sh:/etc/alertmanager/start-alertmanager.sh:ro
    ports:
      - "9093:9093"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: comforthotel-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  docker-metrics-exporter:
    build:
      context: ./services/docker-metrics-exporter
    container_name: comforthotel-docker-metrics-exporter
    restart: unless-stopped
    environment:
      PORT: 9100
      PROJECT_FILTER: comforthotel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "9100"

  grafana:
    image: grafana/grafana:latest
    container_name: comforthotel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_app_data:
  postgres_product_data:
  postgres_order_data:
  postgres_chat_data:
  grafana_data:
