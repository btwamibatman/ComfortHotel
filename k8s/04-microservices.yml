apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: comforthotel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        tier: backend
    spec:
      containers:
        - name: product-service
          image: comforthotel-product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: comforthotel-config
                  key: NODE_ENV
            - name: SERVICE_NAME
              value: product-service
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: comforthotel-config
                  key: PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comforthotel-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://comforthotel:$(DB_PASSWORD)@postgres-product:5432/comforthotel_product
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: comforthotel
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: comforthotel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      containers:
        - name: order-service
          image: comforthotel-order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: comforthotel-config
                  key: NODE_ENV
            - name: SERVICE_NAME
              value: order-service
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: comforthotel-config
                  key: PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comforthotel-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://comforthotel:$(DB_PASSWORD)@postgres-order:5432/comforthotel_order
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: comforthotel-config
                  key: PRODUCT_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: comforthotel
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
