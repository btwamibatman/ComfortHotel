apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-app
  namespace: comforthotel
spec:
  serviceName: postgres-app
  replicas: 1
  selector:
    matchLabels:
      app: postgres-app
  template:
    metadata:
      labels:
        app: postgres-app
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: comforthotel_app
            - name: POSTGRES_USER
              value: comforthotel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comforthotel-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "comforthotel", "-d", "comforthotel_app"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "comforthotel", "-d", "comforthotel_app"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: db-init-sql
          configMap:
            name: db-init-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-app
  namespace: comforthotel
spec:
  selector:
    app: postgres-app
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
