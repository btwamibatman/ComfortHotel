# This manifest prepares Kubernetes auto-scaling for ComfortHotel order-service.
# It creates a namespace, deploys two order-service pods, exposes them through
# an internal service, and adds an HPA that scales the deployment from 2 to 6
# replicas when average CPU utilization is above 70%.
apiVersion: v1
kind: Namespace
metadata:
  name: comforthotel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: comforthotel
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: comforthotel-order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: order-service
            - name: PORT
              value: "3000"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comforthotel-db-secret
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://comforthotel:$(DB_PASSWORD)@postgres-order:5432/comforthotel_order
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: comforthotel
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: comforthotel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
