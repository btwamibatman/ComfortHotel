---
- name: Deploy ComfortHotel with Docker Compose
  hosts: comforthotel
  become: true
  vars:
    project_root: "{{ playbook_dir }}/../.."
    compose_artifacts:
      - .dockerignore
      - Dockerfile.frontend
      - database
      - docker-compose.yml
      - monitoring
      - nginx
      - services
  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone project repository when repo_url is set
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        force: true
      when: repo_url | length > 0

    - name: Copy local project artifacts when repo_url is not set
      ansible.builtin.copy:
        src: "{{ project_root }}/{{ item }}"
        dest: "{{ app_dir }}"
        mode: preserve
      loop: "{{ compose_artifacts }}"
      when: repo_url | length == 0

    - name: Download docker-compose.yml when compose_file_url is set
      ansible.builtin.get_url:
        url: "{{ compose_file_url }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
      when: compose_file_url | length > 0

    - name: Render production environment file
      ansible.builtin.template:
        src: ../templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Build and start ComfortHotel stack
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: "{{ app_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      changed_when: true

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print compose status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
