---
- name: Deploy ComfortHotel with Docker Compose
  hosts: comforthotel
  become: true
  vars:
    project_root: "{{ playbook_dir }}/../.."
    compose_artifacts:
      - .dockerignore
      - Dockerfile.frontend
      - docker-compose.certbot.yml
      - docker-compose.https.yml
      - database
      - docker-compose.yml
      - monitoring
      - nginx
      - services
    compose_files: "-f docker-compose.yml{% if enable_https | bool %} -f docker-compose.https.yml{% endif %}"
    certbot_compose_files: "-f docker-compose.yml -f docker-compose.certbot.yml"
  tasks:
    - name: Validate HTTPS variables
      ansible.builtin.assert:
        that:
          - app_domain | length > 0
          - letsencrypt_email | length > 0
        fail_msg: "Set app_domain and letsencrypt_email in ansible/group_vars/all.yml when enable_https is true."
      when: enable_https | bool

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone project repository when repo_url is set
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        force: true
      when: repo_url | length > 0

    - name: Copy local project artifacts when repo_url is not set
      ansible.builtin.copy:
        src: "{{ project_root }}/{{ item }}"
        dest: "{{ app_dir }}"
        mode: preserve
      loop: "{{ compose_artifacts }}"
      when: repo_url | length == 0

    - name: Download docker-compose.yml when compose_file_url is set
      ansible.builtin.get_url:
        url: "{{ compose_file_url }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
      when: compose_file_url | length > 0

    - name: Render production environment file
      ansible.builtin.template:
        src: ../templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Install Certbot for Let's Encrypt
      ansible.builtin.apt:
        name: certbot
        state: present
        update_cache: true
      when: enable_https | bool

    - name: Enable Certbot renewal timer
      ansible.builtin.systemd:
        name: certbot.timer
        state: started
        enabled: true
      when: enable_https | bool

    - name: Create Let's Encrypt webroot
      ansible.builtin.file:
        path: /var/www/letsencrypt
        state: directory
        mode: "0755"
      when: enable_https | bool

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: "docker compose {{ compose_files }} config --quiet"
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Start temporary HTTP gateway for Let's Encrypt challenge
      ansible.builtin.command:
        cmd: "docker compose {{ certbot_compose_files }} up --build -d"
        chdir: "{{ app_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      changed_when: true
      when: enable_https | bool

    - name: Wait for HTTP gateway
      ansible.builtin.uri:
        url: http://127.0.0.1/nginx-health
        status_code: 200
      register: gateway_health
      retries: 30
      delay: 5
      until: gateway_health.status == 200
      when: enable_https | bool

    - name: Request or renew Let's Encrypt certificate
      ansible.builtin.command:
        cmd: >-
          certbot certonly
          --webroot
          --webroot-path /var/www/letsencrypt
          --cert-name comforthotel
          -d {{ app_domain }}
          --email {{ letsencrypt_email }}
          --agree-tos
          --non-interactive
          --keep-until-expiring
      register: certbot_result
      changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
      when: enable_https | bool

    - name: Install Certbot deploy hook to reload nginx gateway
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-comforthotel-gateway.sh
        mode: "0755"
        content: |
          #!/bin/sh
          cd {{ app_dir }} || exit 0
          COMPOSE_PROJECT_NAME={{ compose_project_name }} docker compose {{ compose_files }} kill -s HUP gateway || true
      when: enable_https | bool

    - name: Build and start ComfortHotel stack
      ansible.builtin.command:
        cmd: "docker compose {{ compose_files }} up --build -d"
        chdir: "{{ app_dir }}"
      environment:
        COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      changed_when: true

    - name: Show running containers
      ansible.builtin.command:
        cmd: "docker compose {{ compose_files }} ps"
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Print compose status
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
