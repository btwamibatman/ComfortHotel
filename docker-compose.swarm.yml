services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comforthotel
      POSTGRES_USER: comforthotel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  app:
    image: comforthotel-app:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://comforthotel:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/comforthotel
      PORT: ${PORT:-3000}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      MANAGER_USERNAME: ${MANAGER_USERNAME}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      MANAGER_EMAIL: ${MANAGER_EMAIL}
      MANAGER_FULL_NAME: ${MANAGER_FULL_NAME}
      USER_USERNAME: ${USER_USERNAME:-}
      USER_PASSWORD: ${USER_PASSWORD:-}
      USER_EMAIL: ${USER_EMAIL:-}
      USER_FULL_NAME: ${USER_FULL_NAME:-}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana_dashboard_json
        target: /var/lib/grafana/dashboards/hotel-booking-system-monitoring.json
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  grafana_data:

configs:
  prometheus_config:
    file: ./monitoring/prometheus/prometheus.yml
  grafana_datasource:
    file: ./monitoring/grafana/provisioning/datasources/datasource.yml
  grafana_dashboards_provider:
    file: ./monitoring/grafana/provisioning/dashboards/dashboard.yml
  grafana_dashboard_json:
    file: ./monitoring/grafana/dashboards/hotel-booking-system-monitoring.json
