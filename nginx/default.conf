upstream web_ui {
  server app:3000;
  keepalive 16;
}

upstream auth_svc {
  server auth-service:3000;
  keepalive 16;
}

upstream product_svc {
  server product-service:3000;
  keepalive 16;
}

upstream order_svc {
  server order-service:3000;
  keepalive 16;
}

upstream chat_svc {
  server chat-service:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;
  error_page 401 = @api_unauthorized;
  limit_req_status 429;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    image/svg+xml;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /auth/status {
    internal;
    proxy_pass http://auth_svc/api/auth/status;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Original-URI $request_uri;
  }

  location @api_unauthorized {
    internal;
    default_type application/json;
    return 401 '{"error":"Authentication required","message":"Please log in to perform this action"}';
  }

  location = /api/auth/status {
    proxy_pass http://auth_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ~ ^/auth/(admin|staff)/login$ {
    limit_req zone=auth_login burst=10 nodelay;
    proxy_pass http://auth_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /auth/ {
    proxy_pass http://auth_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location @product_service_protected {
    error_page 401 = @api_unauthorized;
    auth_request /auth/status;
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_role $upstream_http_x_user_role;
    auth_request_set $auth_user_name $upstream_http_x_user_name;
    proxy_pass http://product_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Role $auth_user_role;
    proxy_set_header X-User-Name $auth_user_name;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /api/rooms {
    error_page 401 = @api_unauthorized;
    error_page 418 = @product_service_protected;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 418;
    }

    proxy_pass http://product_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-User-Name "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /api/bookings/public {
    proxy_pass http://order_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-User-Name "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /api/bookings {
    error_page 401 = @api_unauthorized;
    auth_request /auth/status;
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_role $upstream_http_x_user_role;
    auth_request_set $auth_user_name $upstream_http_x_user_name;
    proxy_pass http://order_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Role $auth_user_role;
    proxy_set_header X-User-Name $auth_user_name;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location @chat_service_protected {
    error_page 401 = @api_unauthorized;
    auth_request /auth/status;
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_role $upstream_http_x_user_role;
    auth_request_set $auth_user_name $upstream_http_x_user_name;
    proxy_pass http://chat_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Role $auth_user_role;
    proxy_set_header X-User-Name $auth_user_name;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /api/contacts {
    error_page 401 = @api_unauthorized;
    error_page 418 = @chat_service_protected;
    if ($request_method !~ ^(POST)$) {
      return 418;
    }

    proxy_pass http://chat_svc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Role "";
    proxy_set_header X-User-Name "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    proxy_pass http://web_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
